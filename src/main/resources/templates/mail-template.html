<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCluster Notification</title>
</head>

<body style="margin:0;padding:30px;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;">

<div style="
    max-width:600px;
    margin:auto;
    background:#ffffff;
    border:1px solid #dddddd;
    border-radius:8px;
    overflow:hidden;">

    <!-- Header -->
    <div style="
        background:#4F46E5;
        color:white;
        padding:18px 25px;">

        <h2 style="margin:0;">
            CodeCluster
        </h2>

    </div>

    <!-- Body -->
    <div style="padding:30px;">

        <h3 style="margin-top:0;color:#333333;">
            {{TITLE}}
        </h3>

        <p style="color:#555555;font-size:15px;line-height:1.7;">

            {{CONTENT}}

        </p>

        <br>

        <p style="color:#555555;">
            Thank you,
            <br>
            <strong>Team CodeCluster</strong>
        </p>

    </div>

    <!-- Footer -->
    <div style="
        background:#f8f8f8;
        border-top:1px solid #e5e5e5;
        padding:18px;
        text-align:center;
        font-size:12px;
        color:#777777;">

        This is an automated email. Please do not reply to this message.

    </div>

</div>

</body>
</html>
